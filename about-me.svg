<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" fill="none" role="img" aria-label="About me: aspiring developer, CS student, indie game designer, competitive gamer, linguaphile" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="566" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#F4B942"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F4B942" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E63946" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <clipPath id="card"><rect width="800" height="566" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Ubuntu, Arial, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .rise  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pop   { opacity: 0; animation: pop .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .45s } .d3 { animation-delay: .7s }
    .r1 { animation-delay: .95s } .r2 { animation-delay: 1.15s } .r3 { animation-delay: 1.35s }
    .r4 { animation-delay: 1.55s } .r5 { animation-delay: 1.75s }
    .b1 { animation-delay: 2.0s } .b2 { animation-delay: 2.15s } .b3 { animation-delay: 2.35s } .b4 { animation-delay: 2.6s }

    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes pop   { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

    .draw { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 1.4s .8s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    .drift1 { animation: drift1 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(50px,40px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-60px,-30px); } }

    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    .sweep { animation: sweepmove 5s ease-in-out 2s infinite; }
    @keyframes sweepmove { 0% { transform: translateX(-300px); } 100% { transform: translateX(800px); } }

    .shine { animation: shine 6s ease-in-out 2.5s infinite; }
    @keyframes shine { 0%,70%,100% { opacity: .55; } 85% { opacity: 1; } }

    .badge { animation: badge 4s ease-in-out 3s infinite; }
    @keyframes badge { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="800" height="566" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle class="drift1" cx="680" cy="50" r="85" fill="#E63946" opacity=".26"/>
      <circle class="drift2" cx="100" cy="530" r="95" fill="#F4B942" opacity=".14"/>
    </g>

    <!-- status pill -->
    <g class="pop d1" style="transform-origin: 40px 46px">
      <rect x="40" y="32" width="158" height="28" rx="14" fill="#E63946" fill-opacity=".1" stroke="#E63946" stroke-opacity=".45"/>
      <circle class="pulse" cx="60" cy="46" r="4" fill="#E63946"/>
      <text class="mono" x="74" y="50" font-size="11" letter-spacing="2" fill="#F5C6CA" font-weight="600">PROFILE ONLINE</text>
    </g>

    <!-- headline -->
    <g class="rise d2">
      <text x="40" y="106" font-size="31" font-weight="700" fill="#F0F3F6" letter-spacing="-0.4">Hey there! I’m an aspiring <tspan fill="url(#accent)">developer</tspan> 👋</text>
    </g>
    <g class="rise d3">
      <text x="40" y="134" font-size="15" fill="#8B949E">Building, learning, and creating — one project at a time.</text>
    </g>

    <line class="draw" x1="40" y1="156" x2="560" y2="156" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>

    <!-- about rows -->
    <g class="slide r1">
      <path d="M44 183 l5 5 -5 5 -5 -5z" fill="#F4B942"/>
      <text x="62" y="193" font-size="14.5" fill="#C9D1D9">I’m a soon-to-graduate <tspan font-weight="600" fill="#F0F3F6">Computer Science</tspan> student at <tspan font-weight="600" fill="#F0F3F6">Mapúa Malayan Colleges Mindanao</tspan>.</text>
      <text x="62" y="212" font-size="12.5" fill="#6E7681">Based in Davao City, Philippines.</text>
    </g>
    <g class="slide r2">
      <path d="M44 233 l5 5 -5 5 -5 -5z" fill="#E63946"/>
      <text x="62" y="243" font-size="14.5" fill="#C9D1D9">I’m an aspiring <tspan font-weight="600" fill="#F0F3F6">Indie Game Designer</tspan> &amp; <tspan font-weight="600" fill="#F0F3F6">Systems/App Developer</tspan>.</text>
      <text x="62" y="262" font-size="12.5" fill="#6E7681">I love learning how to develop systems.</text>
    </g>
    <g class="slide r3">
      <path d="M44 293 l5 5 -5 5 -5 -5z" fill="#F4B942"/>
      <text x="62" y="303" font-size="14.5" fill="#C9D1D9">I Love Playing <tspan font-weight="600" fill="#F0F3F6">Competitive Games</tspan> and Challenging Myself to Do Better.</text>
    </g>
    <g class="slide r4">
      <path d="M44 325 l5 5 -5 5 -5 -5z" fill="#E63946"/>
      <text x="62" y="335" font-size="14.5" fill="#C9D1D9">I’m <tspan font-weight="600" fill="#F0F3F6">Adaptable</tspan> and <tspan font-weight="600" fill="#F0F3F6">Passionate towards the things i do.</tspan>.</text>
    </g>
    <g class="slide r5">
      <path d="M44 357 l5 5 -5 5 -5 -5z" fill="#F4B942"/>
      <text x="62" y="367" font-size="14.5" fill="#C9D1D9">I’m a <tspan font-weight="600" fill="#F0F3F6">Linguaphile</tspan> and a <tspan font-weight="600" fill="#F0F3F6">Casual Reader</tspan>.</text>
    </g>

    <!-- orbit graphic -->
    <g class="pop d3" style="transform-origin: 700px 150px">
      <g class="float">
        <circle cx="700" cy="150" r="62" stroke="#ffffff" stroke-opacity=".06"/>
        <circle cx="700" cy="150" r="46" stroke="url(#accent)" stroke-width="1.2" stroke-dasharray="3 7" stroke-linecap="round" opacity=".75">
          <animateTransform attributeName="transform" type="rotate" from="0 700 150" to="360 700 150" dur="40s" repeatCount="indefinite"/>
        </circle>
        <circle cx="700" cy="150" r="31" stroke="#ffffff" stroke-opacity=".1" stroke-dasharray="1 6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="360 700 150" to="0 700 150" dur="30s" repeatCount="indefinite"/>
        </circle>
        <g><circle cx="700" cy="88" r="4.5" fill="#E63946"/>
          <animateTransform attributeName="transform" type="rotate" from="0 700 150" to="360 700 150" dur="14s" repeatCount="indefinite"/></g>
        <g><circle cx="700" cy="119" r="3" fill="#F4B942"/>
          <animateTransform attributeName="transform" type="rotate" from="180 700 150" to="-180 700 150" dur="9s" repeatCount="indefinite"/></g>
        <circle cx="700" cy="150" r="19" fill="#E63946" fill-opacity=".08" stroke="#E63946" stroke-opacity=".35"/>
        <text class="mono shine" x="700" y="155" font-size="13" font-weight="700" fill="#F4B942" text-anchor="middle">&lt;/&gt;</text>
      </g>
    </g>

    <!-- divider -->
    <line x1="40" y1="394" x2="760" y2="394" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- building section (centered) -->
    <g class="rise b1">
      <text class="mono" x="400" y="422" font-size="11" fill="#8B949E" letter-spacing="2" text-anchor="middle">DEVELOPING</text>
    </g>
    <g class="pop b2" style="transform-origin: 400px 448px">
      <g class="badge">
        <rect x="314" y="434" width="172" height="26" rx="13" fill="url(#accent)"/>
        <text class="mono" x="400" y="451" font-size="11" font-weight="700" fill="#0D1117" text-anchor="middle" letter-spacing="1">SYSTEMS &amp; GAMES</text>
      </g>
    </g>
    <g class="rise b3">
      <text x="400" y="494" font-size="14.5" font-weight="600" fill="#F0F3F6" text-anchor="middle">🏴‍☠️&#160;&#160;&amp;Turning ideas into reality, one project at a time.&#160;&#160;🥕</text>
      <text x="400" y="520" font-size="14.5" font-weight="600" fill="#F0F3F6" text-anchor="middle">☄️&#160;&#160;Hololarpjoyer &amp; Merch Collector&#160;&#160;🌽</text>
    </g>

    <!-- quote -->
    <g class="rise b4">
      <text x="400" y="550" font-size="13" font-style="italic" fill="#9DA7B3" text-anchor="middle">🏆&#160;&#160;No risk, no story. No pain, <tspan fill="#F4B942">no glory.</tspan></text>
    </g>

    <rect class="sweep" x="0" y="0" width="300" height="2" fill="url(#fade)"/>
  </g>

  <rect x=".5" y=".5" width="799" height="565" rx="19.5" stroke="#ffffff" stroke-opacity=".08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
