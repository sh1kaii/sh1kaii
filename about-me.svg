<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" fill="none" role="img" aria-label="About me: aspiring developer, CS student, indie game developer, competitive gamer, linguaphile" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="566" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B63E4B"/>
      <stop offset="1" stop-color="#C9A55C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B63E4B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C9A55C" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B63E4B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#B63E4B" stop-opacity=".16"/><stop offset=".6" stop-color="#B63E4B" stop-opacity=".05"/><stop offset="1" stop-color="#B63E4B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowRed"><stop offset="0" stop-color="#B63E4B" stop-opacity=".20"/><stop offset="1" stop-color="#B63E4B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGold"><stop offset="0" stop-color="#C9A55C" stop-opacity=".11"/><stop offset="1" stop-color="#C9A55C" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="800" height="566" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Ubuntu, Arial, 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    .rise  { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .slide { opacity: 0; animation: slide .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .pop   { opacity: 0; animation: pop .6s cubic-bezier(.2,.9,.3,1.2) forwards; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .45s } .d3 { animation-delay: .7s }
    .r1 { animation-delay: .95s } .r2 { animation-delay: 1.15s } .r3 { animation-delay: 1.35s }
    .r4 { animation-delay: 1.55s } .r5 { animation-delay: 1.75s }
    .b1 { animation-delay: 2.0s } .b2 { animation-delay: 2.15s } .b3 { animation-delay: 2.35s } .b4 { animation-delay: 2.6s }

    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
    @keyframes pop   { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

    .draw { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 1.4s .8s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    .drift1 { animation: drift1 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(30px,25px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-40px,-20px); } }

    .sweep { animation: sweepmove 5s ease-in-out 2s infinite; }
    @keyframes sweepmove { 0% { transform: translateX(-300px); } 100% { transform: translateX(800px); } }

    .shine { animation: shine 6s ease-in-out 2.5s infinite; }
    @keyframes shine { 0%,70%,100% { opacity: .55; } 85% { opacity: 1; } }

    .badge { animation: badge 4s ease-in-out 3s infinite; }
    @keyframes badge { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="800" height="566" fill="url(#bg)"/>

    <circle class="drift1" cx="690" cy="40" r="170" fill="url(#glowRed)"/>
    <circle class="drift2" cx="90" cy="540" r="180" fill="url(#glowGold)"/>

    <!-- status pill -->
    <g class="pop d1" style="transform-origin: 40px 46px">
      <rect x="40" y="32" width="158" height="28" rx="14" fill="#B63E4B" fill-opacity=".1" stroke="#B63E4B" stroke-opacity=".45"/>
      <circle class="pulse" cx="60" cy="46" r="4" fill="#B63E4B"/>
      <text class="mono" x="74" y="50" font-size="11" letter-spacing="2" fill="#D9B2B6" font-weight="600">PROFILE ONLINE</text>
    </g>

    <!-- headline -->
    <g class="rise d2">
      <text x="40" y="106" font-size="31" font-weight="700" fill="#F0F3F6" letter-spacing="-0.4">Hey there! I’m an Aspiring <tspan fill="url(#accent)">Developer</tspan> 👋</text>
    </g>
    <g class="rise d3">
      <text x="40" y="134" font-size="15" fill="#8B949E">Welcome to my little corner of GitHub.</text>
    </g>

    <line class="draw" x1="40" y1="156" x2="560" y2="156" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>

    <!-- about rows -->
    <g class="slide r1">
      <path d="M44 183 l5 5 -5 5 -5 -5z" fill="#C9A55C"/>
      <text x="62" y="193" font-size="14.5" fill="#C9D1D9">I’m a soon-to-graduate <tspan font-weight="600" fill="#F0F3F6">Computer Science</tspan> student at <tspan font-weight="600" fill="#F0F3F6">Mapúa Malayan Colleges Mindanao</tspan>.</text>
      <text x="62" y="212" font-size="12.5" fill="#6E7681">Based in Davao City, Philippines.</text>
    </g>
    <g class="slide r2">
      <path d="M44 233 l5 5 -5 5 -5 -5z" fill="#B63E4B"/>
      <text x="62" y="243" font-size="14.5" fill="#C9D1D9">I’m an Aspiring <tspan font-weight="600" fill="#F0F3F6">Indie Game Developer</tspan> &amp; <tspan font-weight="600" fill="#F0F3F6">Systems/App Developer</tspan>.</text>
      <text x="62" y="262" font-size="12.5" fill="#6E7681">I Love Learning How to Develop Systems.</text>
    </g>
    <g class="slide r3">
      <path d="M44 293 l5 5 -5 5 -5 -5z" fill="#C9A55C"/>
      <text x="62" y="303" font-size="14.5" fill="#C9D1D9">I Love Playing <tspan font-weight="600" fill="#F0F3F6">Competitive Games</tspan> and <tspan font-weight="600" fill="#F0F3F6">Challenging Myself to Do Better</tspan>.</text>
    </g>
    <g class="slide r4">
      <path d="M44 325 l5 5 -5 5 -5 -5z" fill="#B63E4B"/>
      <text x="62" y="335" font-size="14.5" fill="#C9D1D9">I’m <tspan font-weight="600" fill="#F0F3F6">Adaptable</tspan> and <tspan font-weight="600" fill="#F0F3F6">Passionate</tspan> towards the things I do.</text>
    </g>
    <g class="slide r5">
      <path d="M44 357 l5 5 -5 5 -5 -5z" fill="#C9A55C"/>
      <text x="62" y="367" font-size="14.5" fill="#C9D1D9">I’m a <tspan font-weight="600" fill="#F0F3F6">Linguaphile</tspan> and a <tspan font-weight="600" fill="#F0F3F6">Casual Reader</tspan>.</text>
    </g>

    <!-- orbit graphic (pure SMIL, centered on its own origin) -->
    <g transform="translate(714 118)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.8s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>

        <!-- soft halo -->
        <circle r="62" fill="url(#halo)"/>

        <!-- rings -->
        <circle r="60" stroke="#ffffff" stroke-opacity=".07"/>
        <circle r="45" stroke="url(#accent)" stroke-width="1.2" stroke-dasharray="3 7" stroke-linecap="round" opacity=".7">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        </circle>
        <circle r="30" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="1 6" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
        </circle>

        <!-- orbiting dots: crimson, gold, and a faint third -->
        <g>
          <circle cx="0" cy="-60" r="4.5" fill="#B63E4B"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="0" cy="-45" r="3.2" fill="#C9A55C"/>
          <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="10s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="0" cy="-30" r="2.2" fill="#E7E2D8" fill-opacity=".7"/>
          <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="7s" repeatCount="indefinite"/>
        </g>

        <!-- core -->
        <circle r="18" fill="#B63E4B" fill-opacity=".1" stroke="#C9A55C" stroke-opacity=".4"/>
        <text class="mono shine" x="0" y="4.5" font-size="12" font-weight="700" fill="#C9A55C" text-anchor="middle">&lt;/&gt;</text>
      </g>
    </g>

    <!-- divider -->
    <line x1="40" y1="394" x2="760" y2="394" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- developing section (centered) -->
    <g class="rise b1">
      <text class="mono" x="400" y="422" font-size="11" fill="#8B949E" letter-spacing="2" text-anchor="middle">DEVELOPING</text>
    </g>
    <g class="pop b2" style="transform-origin: 400px 448px">
      <g class="badge">
        <rect x="314" y="434" width="172" height="26" rx="13" fill="url(#accent)"/>
        <text class="mono" x="400" y="451" font-size="11" font-weight="700" fill="#0D1117" text-anchor="middle" letter-spacing="1">SYSTEMS &amp; DESIGNS</text>
      </g>
    </g>
    <g class="rise b3">
      <text x="400" y="494" font-size="14.5" font-weight="600" fill="#F0F3F6" text-anchor="middle">🏴‍☠️&#160;&#160;Turning ideas into reality, One project at a time.&#160;&#160;🥕</text>
      <text x="400" y="520" font-size="14.5" font-weight="600" fill="#F0F3F6" text-anchor="middle">☄️&#160;&#160;Hololive Enjoyer &amp; Merch Collector&#160;&#160;🌽</text>
    </g>

    <!-- quote -->
    <g class="rise b4">
      <text x="400" y="550" font-size="13" font-style="italic" fill="#9DA7B3" text-anchor="middle">No risk, No story. No pain, <tspan fill="#C9A55C">No glory.</tspan>&#160;&#160;🏆</text>
    </g>

    <rect class="sweep" x="0" y="0" width="300" height="2" fill="url(#fade)"/>
  </g>

  <rect x=".5" y=".5" width="799" height="565" rx="19.5" stroke="#ffffff" stroke-opacity=".08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
