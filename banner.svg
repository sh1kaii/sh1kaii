
<svg width="750" height="90" viewBox="0 0 750 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1;
      rx: 12px;
    }

    .star {
      fill: #60A5FA;
      opacity: 0.8;
      animation: shootingStar linear infinite;
    }

    .sparkle {
      fill: #FFFFFF;
      animation: twinkle ease-in-out infinite alternate;
    }

    @keyframes shootingStar {
      0% { transform: translateY(-15px) translateX(-10px); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(100px) translateX(30px); opacity: 0; }
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.4); }
    }

    .line {
      font-family: monospace, sans-serif;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.4px;
      text-anchor: middle;
      dominant-baseline: middle;
      opacity: 0;
      filter: url(#glow);
    }

    .l1 { fill: #E63946; animation: fadeCycle 16s infinite 0s; }
    .l2 { fill: #60A5FA; animation: fadeCycle 16s infinite 4s; }
    .l3 { fill: #3B82F6; animation: fadeCycle 16s infinite 8s; }
    .l4 { fill: #F8FAFC; animation: fadeCycle 16s infinite 12s; }

    @keyframes fadeCycle {
      0%   { opacity: 0; transform: translateY(6px); }
      4%   { opacity: 1; transform: translateY(0px); }
      21%  { opacity: 1; transform: translateY(0px); }
      25%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }
  </style>

  <rect x="5" y="5" width="740" height="80" class="bg" />

  <circle cx="40" cy="0" r="2" class="star" style="animation-duration: 1.4s; animation-delay: 0.1s;" />
  <circle cx="95" cy="0" r="1.5" class="sparkle" style="animation-duration: 1.1s; animation-delay: 0.6s;" />
  <circle cx="150" cy="0" r="2.2" class="star" style="animation-duration: 1.7s; animation-delay: 0.3s;" />
  <circle cx="210" cy="0" r="1" class="sparkle" style="animation-duration: 0.9s; animation-delay: 0.8s;" />
  <circle cx="280" cy="0" r="2.5" class="star" style="animation-duration: 1.5s; animation-delay: 0.2s;" />
  <circle cx="340" cy="0" r="1.5" class="sparkle" style="animation-duration: 1.3s; animation-delay: 0.5s;" />
  <circle cx="410" cy="0" r="2" class="star" style="animation-duration: 1.2s; animation-delay: 0.7s;" />
  <circle cx="475" cy="0" r="1.2" class="sparkle" style="animation-duration: 1.0s; animation-delay: 0.4s;" />
  <circle cx="535" cy="0" r="2.3" class="star" style="animation-duration: 1.6s; animation-delay: 0.9s;" />
  <circle cx="600" cy="0" r="1.5" class="sparkle" style="animation-duration: 1.2s; animation-delay: 0.1s;" />
  <circle cx="665" cy="0" r="2.2" class="star" style="animation-duration: 1.4s; animation-delay: 0.6s;" />
  <circle cx="715" cy="0" r="1" class="sparkle" style="animation-duration: 0.8s; animation-delay: 0.3s;" />

  <text x="50%" y="53%" class="line l1">ハローワールド！🏴‍☠️</text>
  <text x="50%" y="53%" class="line l2">Aspiring Full Stack &amp; Game Dev Larper 🥕</text>
  <text x="50%" y="53%" class="line l3">I love learning new things, especially languages ☄️</text>
  <text x="50%" y="53%" class="line l4">🚂 Wishlist G.O.R.D on Steam! 🌽</text>
</svg>
